version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3004:3004"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3004
    restart: always

  buyer-portal:
    build:
      context: ./next-frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://backend:3004
    depends_on:
      - backend
    restart: always

  vendor-portal:
    build:
      context: ./next-vendor
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - NEXT_PUBLIC_API_URL=http://backend:3004
    depends_on:
      - backend
    restart: always

  rider-portal:
    build:
      context: ./next-rider
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - NEXT_PUBLIC_API_URL=http://backend:3004
    depends_on:
      - backend
    restart: always

  admin-portal:
    build:
      context: ./next-admin
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - NEXT_PUBLIC_API_URL=http://backend:3004
    depends_on:
      - backend
    restart: always
