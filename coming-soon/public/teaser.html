<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passwala — Cinematic 3D Teaser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff6b00;
      --primary-glow: rgba(255, 107, 0, 0.4);
      --bg-dark: #050811;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Ambient Background Glows */
    .glow-container {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .glow-orange {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(255, 107, 0, 0.15) 0%, rgba(5, 8, 17, 0) 70%);
      filter: blur(80px);
      animation: pulse-glow 6s ease-in-out infinite alternate;
    }

    @keyframes pulse-glow {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    }

    /* Interactive Cinematic Text Containers */
    .cinematic-container {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 900px;
      padding: 20px;
      transform-style: preserve-3d;
      animation: float-3d 8s ease-in-out infinite;
    }

    @keyframes float-3d {
      0% { transform: rotateY(-5deg) rotateX(5deg) translateZ(0px); }
      50% { transform: rotateY(5deg) rotateX(-5deg) translateZ(30px); }
      100% { transform: rotateY(-5deg) rotateX(5deg) translateZ(0px); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 107, 0, 0.1);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 24px;
      box-shadow: 0 0 20px rgba(255, 107, 0, 0.2);
      transform: translateZ(50px);
      opacity: 0;
      animation: fade-in-up 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.5s;
    }

    .title {
      font-size: 4.5rem;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -2px;
      margin-bottom: 24px;
      transform: translateZ(80px);
      opacity: 0;
      animation: fade-in-up 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.8s;
    }

    .gradient-text {
      background: linear-gradient(135deg, #ff6b00 0%, #ffaa66 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 50px rgba(255, 107, 0, 0.25);
    }

    .subtitle {
      font-size: 1.5rem;
      color: #94a3b8;
      font-weight: 300;
      line-height: 1.6;
      max-width: 680px;
      margin: 0 auto 40px auto;
      transform: translateZ(40px);
      opacity: 0;
      animation: fade-in-up 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 1.1s;
    }

    /* Custom 3D Logo Element */
    .logo-3d-box {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px auto;
      position: relative;
      transform-style: preserve-3d;
      animation: rotate-logo 12s linear infinite;
    }

    .logo-face {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(255, 107, 0, 0.05);
      border: 2px solid var(--primary);
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      font-weight: 900;
      box-shadow: 0 0 30px rgba(255, 107, 0, 0.2);
    }

    /* Cube coordinates for 3D logo */
    .face-front  { transform: translateZ(60px); }
    .face-back   { transform: rotateY(180deg) translateZ(60px); }
    .face-left   { transform: rotateY(-90deg) translateZ(60px); }
    .face-right  { transform: rotateY(90deg) translateZ(60px); }
    .face-top    { transform: rotateX(90deg) translateZ(60px); }
    .face-bottom { transform: rotateX(-90deg) translateZ(60px); }

    @keyframes rotate-logo {
      0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
    }

    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translate3d(0, 40px, 0) translateZ(inherit);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) translateZ(inherit);
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Glow -->
  <div class="glow-container">
    <div class="glow-orange"></div>
  </div>

  <!-- Particle Starfield Canvas -->
  <canvas id="starfield"></canvas>

  <!-- Content Layout -->
  <div class="cinematic-container">
    <!-- Rotating 3D Branding Cube -->
    <div class="logo-3d-box">
      <div class="logo-face face-front">P.</div>
      <div class="logo-face face-back">P.</div>
      <div class="logo-face face-left">P.</div>
      <div class="logo-face face-right">P.</div>
      <div class="logo-face face-top">P.</div>
      <div class="logo-face face-bottom">P.</div>
    </div>

    <div class="badge">Passwala</div>
    <h1 class="title">
      Something New is <br>
      <span class="gradient-text">Brewing in India</span>
    </h1>
    <p class="subtitle">
      Prepare for the smartest, luxury neighborhood platform. Event bookings, premium transport, verified service experts & essentials.
    </p>
  </div>

  <script>
    // Particle Starfield Engine
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const stars = [];
    const starCount = 180;

    class Star {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.z = Math.random() * width; // depth
        this.radius = Math.random() * 1.5 + 0.5;
        this.color = Math.random() > 0.5 ? '#ff6b00' : '#ffffff';
        this.speed = Math.random() * 1.5 + 0.5;
      }

      update() {
        this.z -= this.speed;
        if (this.z <= 0) {
          this.reset();
          this.z = width;
        }
      }

      draw() {
        // 3D perspective projection
        const px = (this.x - width / 2) * (width / this.z) + width / 2;
        const py = (this.y - height / 2) * (width / this.z) + height / 2;
        const pSize = this.radius * (width / this.z);

        if (px < 0 || px > width || py < 0 || py > height) {
          return;
        }

        ctx.beginPath();
        ctx.arc(px, py, pSize, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        // Make closer stars brighter/glowing
        const alpha = Math.min(1, 1 - this.z / width);
        ctx.shadowBlur = pSize * 2;
        ctx.shadowColor = this.color;
        ctx.globalAlpha = alpha;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
      }
    }

    // Initialize stars
    for (let i = 0; i < starCount; i++) {
      stars.push(new Star());
    }

    // Animation Loop
    function animate() {
      ctx.fillStyle = 'rgba(5, 8, 17, 0.2)'; // trail effect
      ctx.fillRect(0, 0, width, height);

      stars.forEach(star => {
        star.update();
        star.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();

    // Handle resizing
    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Mouse interactive 3D effect
    const container = document.querySelector('.cinematic-container');
    document.addEventListener('mousemove', (e) => {
      const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
      container.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg) translateZ(30px)`;
    });
  </script>
</body>
</html>
